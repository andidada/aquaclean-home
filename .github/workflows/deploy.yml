name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose environment
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== ENVIRONMENT DIAGNOSTICS ====="
          echo "NETLIFY_SITE_ID: [${NETLIFY_SITE_ID}]"
          echo "NETLIFY_AUTH_TOKEN set: [${#NETLIFY_AUTH_TOKEN}] chars"
          echo "GITHUB_TOKEN set: [${#GITHUB_TOKEN}] chars"
          echo "HOME: [$HOME]"
          echo "GITHUB_WORKSPACE: [$GITHUB_WORKSPACE]"
          echo "RUNNER_TEMP: [$RUNNER_TEMP]"
          echo ""
          echo "===== PYTHON VERSION ====="
          python3 --version
          echo ""
          echo "===== PIP PACKAGES ====="
          python3 -m pip list 2>/dev/null | grep -i netlify || echo "netlify-cli not in pip"
          echo ""
          echo "===== NETLIFY CLI TEST ====="
          if command -v netlify &>/dev/null; then
            netlify --version 2>&1 || true
            echo "--- token env test ---"
            env | grep -i NETLIFY || true
          else
            echo "netlify CLI not found in PATH"
          fi
          echo ""
          echo "===== ATTEMPT DIRECT API UPLOAD (shell/curl) ====="
          python3 << 'PYEOF'
import os, sys, json, tarfile, io, http.client, traceback

TOKEN = os.environ.get("NETLIFY_AUTH_TOKEN", "")
SITE  = os.environ.get("NETLIFY_SITE_ID", "")
print(f"TOKEN len={len(TOKEN)}, SITE={SITE}", flush=True)

if not TOKEN:
    print("ERROR: NETLIFY_AUTH_TOKEN is empty or not set", flush=True)
    sys.exit(1)

try:
    # Step 1: Create deploy
    conn = http.client.HTTPSConnection("api.netlify.com", timeout=60)
    headers = {"Authorization": f"Bearer {TOKEN}"}
    conn.request("POST",
        f"/api/v1/sites/{SITE}/deploys",
        headers={**headers, "Content-Type": "application/json"},
        body=b"{}")
    resp = conn.getresponse()
    raw = resp.read()
    print(f"Create deploy: {resp.status} {raw[:400].decode(errors='replace')}", flush=True)
    data = json.loads(raw)
    deploy_id  = data["id"]
    deploy_url = data["deploy_url"]
    print(f"Got deploy_id={deploy_id}, deploy_url={deploy_url}", flush=True)

    # Step 2: Build & upload tarball
    buf = io.BytesIO()
    with tarfile.open(fileobj=buf, mode="w:gz") as tar:
        tar.add(".", arcname="")
    tar_bytes = buf.getvalue()
    print(f"Tarball size: {len(tar_bytes)/1024:.0f} KB", flush=True)

    conn.request("PUT",
        f"/api/v1/deploys/{deploy_id}/files",
        body=tar_bytes,
        headers={**headers, "Content-Type": "application/gzip"})
    resp2 = conn.getresponse()
    raw2 = resp2.read()
    print(f"Upload tarball: {resp2.status} {raw2[:200].decode(errors='replace')}", flush=True)

    # Step 3: Restore (make live)
    conn.request("POST",
        f"/api/v1/deploys/{deploy_id}/restore",
        headers={**headers, "Content-Type": "application/json"},
        body=b"{}")
    resp3 = conn.getresponse()
    raw3 = resp3.read()
    print(f"Restore: {resp3.status} {raw3[:200].decode(errors='replace')}", flush=True)

    conn.close()
    print()
    print("=== SUCCESS ===", flush=True)
    print(f"Deploy: https://{deploy_url}", flush=True)
    print(f"Site:   https://aquaclean-home.netlify.app", flush=True)

except Exception as e:
    print(f"EXCEPTION: {type(e).__name__}: {e}", flush=True)
    traceback.print_exc(file=sys.stdout)
    sys.exit(1)
          PYEOF
