name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .
            en
            ar
            ru
            fr
            es
            vi
            id
            th
            admin
            assets
          sparse-checkout-cone-mode: false

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@27.1.0

      - name: Deploy to Netlify (skip build)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_BUILD_DISABLED: "true"
        run: |
          echo "=== NETLIFY TOKEN CHECK ==="
          echo "Token length: ${#NETLIFY_AUTH_TOKEN}"
          echo "Token prefix: ${NETLIFY_AUTH_TOKEN:0:4}"
          echo "SITE_ID: $NETLIFY_SITE_ID"
          echo ""
          echo "=== NETLIFY LOGIN CHECK ==="
          netlify login --token "$NETLIFY_AUTH_TOKEN" 2>&1 || echo "Login returned: $?"
          echo ""
          echo "=== DEPLOY ==="
          netlify deploy --prod --dir=. --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --no-build 2>&1
          echo "Deploy exit code: $?"
          echo ""
          echo "=== SITE CHECK ==="
          curl -sI "https://aquaclean-home.netlify.app" | head -3
