name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify via API
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -x
          echo "NETLIFY_SITE_ID is set: $NETLIFY_SITE_ID"
          echo "NETLIFY_AUTH_TOKEN length: ${#NETLIFY_AUTH_TOKEN}"

          python3 -c "
import os, tarfile, io, json, base64, http.client, traceback

TOKEN = os.environ['NETLIFY_AUTH_TOKEN']
SITE  = os.environ['NETLIFY_SITE_ID']
print('Site ID:', SITE)
print('Token prefix:', TOKEN[:4] + '...')

# Build tarball
buf = io.BytesIO()
with tarfile.open(fileobj=buf, mode='w:gz') as tar:
    tar.add('.', arcname='')
tar_bytes = buf.getvalue()
print('Tarball size: {:.1f} KB'.format(len(tar_bytes)/1024))

# Step 1: Create deploy
conn = http.client.HTTPSConnection('api.netlify.com', timeout=60)
headers = {
    'Authorization': 'Bearer ' + TOKEN,
}
body = json.dumps({}).encode()
conn.request('POST', '/api/v1/sites/{}/deploys'.format(SITE),
              headers=headers, body=body)
resp = conn.getresponse()
raw = resp.read()
print('Create deploy status:', resp.status)
print('Create deploy body:', raw[:300].decode(errors='replace'))
data = json.loads(raw)
deploy_id = data['id']
deploy_url = data['deploy_url']
print('Deploy ID:', deploy_id)
print('Deploy URL:', deploy_url)

# Step 2: Upload tarball
conn.request('PUT', '/api/v1/deploys/{}/files'.format(deploy_id),
              body=tar_bytes,
              headers={**headers, 'Content-Type': 'application/gzip'})
resp2 = conn.getresponse()
raw2 = resp2.read()
print('Upload status:', resp2.status)
print('Upload body:', raw2[:300].decode(errors='replace'))

# Step 3: Restore (make live)
conn.request('POST', '/api/v1/deploys/{}/restore'.format(deploy_id),
              headers={**headers, 'Content-Type': 'application/json'},
              body=json.dumps({}).encode())
resp3 = conn.getresponse()
raw3 = resp3.read()
print('Restore status:', resp3.status)
print('Restore body:', raw3[:300].decode(errors='replace'))

conn.close()
print()
print('=== SUCCESS ===')
print('Deploy ID:', deploy_id)
print('URL: https://' + deploy_url)
print('Site: https://aquaclean-home.netlify.app')
          " 2>&1 || echo "PYTHON EXIT CODE: $?"
