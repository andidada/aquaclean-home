name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -e
          echo "=== ENV CHECK ==="
          echo "NETLIFY_SITE_ID is set: $NETLIFY_SITE_ID"
          echo "NETLIFY_AUTH_TOKEN length: ${#NETLIFY_AUTH_TOKEN}"

          echo "=== INSTALLING NETLIFY CLI ==="
          timeout 120 npx netlify-cli@27.1.0 --version || echo "npx install timed out or failed"

          echo "=== NETLIFY DEPLOY ==="
          npx netlify-cli@27.1.0 deploy \
            --prod \
            --dir=. \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$NETLIFY_SITE_ID" \
            2>&1 | tee deploy.log

          echo "=== DEPLOY LOG TAIL ==="
          tail -20 deploy.log || true
