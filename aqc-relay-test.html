<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>relay diag</title></head>
<body>
<pre id="out">running...</pre>
<script>
var out = document.getElementById('out');
function log(s) { out.textContent += '\n' + s; }
log('origin=' + location.origin);

window.addEventListener('message', function (ev) {
  log('MSG from=' + ev.origin + ' data=' + JSON.stringify(ev.data)
    + ' isFrame=' + (ev.source === (window.__f && window.__f.contentWindow)));
});

window.addEventListener('load', function () {
  var f = document.createElement('iframe');
  f.src = 'https://aquaclean-admin.app.workbuddy.host/inquiry-proxy.html';
  f.style.cssText = 'position:absolute;width:0;height:0;border:0;';
  f.onload = function () { log('IFRAME loaded'); };
  f.onerror = function () { log('IFRAME error'); };
  document.body.appendChild(f);
  window.__f = f;

  setTimeout(function () {
    log('sending...');
    try {
      f.contentWindow.postMessage({
        type: 'aqc-inquiry', id: 'd1',
        payload: {
          name: 'E2E Tester', email: 'e2e@example.com', company: 'Verification Co',
          country: 'DE', products_interested: 'robot-vacuum', quantity: '250 units',
          message: 'End-to-end relay check from the public site.', hp: '',
          lang: 'en', page_path: location.pathname, referrer: '',
          renderedAt: Date.now() - 30000
        }
      }, '*');
      log('sent');
    } catch (e) { log('SEND THROW ' + e); }
  }, 3000);
});
</script>
</body></html>
