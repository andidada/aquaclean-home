<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>form e2e</title></head>
<body>
<pre id="out">running...</pre>
<iframe id="host" src="/en/index.html" style="width:1200px;height:900px;border:1px solid #ccc;"></iframe>
<script>
var out = document.getElementById('out');
function log(s) { out.textContent += '\n' + s; }
log('origin=' + location.origin);

var f = document.getElementById('host');
f.onload = function () {
  log('home iframe loaded');
  var w = f.contentWindow, d = f.contentDocument;
  try {
    // 同域，所以能直接改这个 window 的 fetch：把 Formspree 挡掉，
    // 只验证我们自己这条中继链路（否则会真的发一封邮件出去）
    w.fetch = function () { return Promise.resolve({ ok: true, status: 200 }); };
    log('home fetch stubbed');
  } catch (e) { log('stub failed ' + e); }
  setTimeout(function () {
    try {
      d.getElementById('name').value = 'Real Form Tester';
      d.getElementById('email').value = 'realform@example.com';
      d.getElementById('company').value = 'Realform Ltd';
      d.getElementById('country').value = 'FR';
      d.getElementById('products_interested').value = 'steam-cleaner';
      d.getElementById('quantity').value = '1000 units';
      d.getElementById('message').value = 'Submitted through the actual homepage form.';
      log('form filled');
      d.getElementById('mainInquiryForm').dispatchEvent(
        new w.Event('submit', { bubbles: true, cancelable: true }));
      log('submit dispatched');
    } catch (e) { log('FILL THROW ' + e); }
  }, 3000);
};
</script>
</body></html>
