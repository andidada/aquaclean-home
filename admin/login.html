<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaClean 后台登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--a-primary, #2563EB) 0%, var(--a-primary-dark, #1D4ED8) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-box {
      background: var(--a-surface, #FFFFFF);
      padding: 40px;
      border-radius: var(--a-radius, 14px);
      box-shadow: 0 20px 60px rgb(15 23 42 / .28);
      width: 100%;
      max-width: 420px;
    }
    h1 {
      text-align: center;
      color: var(--a-brand-ink, #0B1B33);
      margin-bottom: 8px;
      font-size: 24px;
      line-height: 1.4;
    }
    .subtitle {
      text-align: center;
      color: var(--a-muted, #64748B);
      font-size: 14px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--a-muted, #64748B);
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--a-border, #E2E8F0);
      border-radius: var(--a-radius-sm, 8px);
      font-size: 16px;
      font-family: inherit;
      color: var(--a-text, #1E293B);
      transition: border-color .18s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--a-primary, #2563EB);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--a-primary, #2563EB) 0%, var(--a-primary-dark, #1D4ED8) 100%);
      color: #fff;
      border: none;
      border-radius: var(--a-radius-sm, 8px);
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: filter .18s ease, box-shadow .18s ease;
    }
    button:hover {
      filter: brightness(.94);
      box-shadow: 0 8px 20px -6px rgb(37 99 235 / .45);
    }
    .error {
      color: var(--a-danger, #DC2626);
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }
    .hint {
      text-align: center;
      margin-top: 20px;
      color: var(--a-muted, #64748B);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      body { padding: 16px 12px; align-items: flex-start; }
      .login-box { padding: 28px 20px; max-width: 100%; }
      h1 { font-size: 21px; }
      input { font-size: 16px; } /* 16px stops iOS Safari zooming on focus */
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
  <link rel="stylesheet" href="admin-theme.css">
</head>
<body>
  <div class="login-box">
    <h1>🔐 AquaClean 管理后台</h1>
    <p class="subtitle">登录后可管理产品内容与分类</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button type="submit">登录</button>
      <div class="error" id="error">用户名或密码错误</div>
    </form>
    <div class="hint">AquaClean Home · 内容管理后台</div>
  </div>

  <script>
  (function () {
    // ── 登录校验 ────────────────────────────────────────────────
    // The password itself is NOT in this file - only a salted SHA-256
    // digest. Regenerate with scripts/hash_admin_password.py whenever the
    // password changes, and keep AQC_ADMIN_SALT in sync with that script.
    //
    // Two modes, picked automatically:
    //
    //   server - /.netlify/functions/admin-auth is configured, so the
    //            password is checked server-side and we get back a signed,
    //            expiring session token. This is real authentication.
    //   local  - no function available (e.g. served from GitHub Pages),
    //            so we compare against the digest below. That only keeps
    //            the password out of the repo; it is still client-side and
    //            can be bypassed.
    var AUTH_ENDPOINT = '/.netlify/functions/admin-auth';

    // Client-side fallback only. Regenerate with scripts/hash_admin_password.py
    // and keep AQC_ADMIN_SALT in sync with that script.
    var AQC_USERNAME = 'admin';
    var AQC_ADMIN_SALT = 'AQC-Admin-Login-v1';
    var AQC_PASSWORD_HASH =
      'c55d159448b8df02f5242ae3e561b00ae99e6a1befccd0aec7577a775d943f44';

    var form = document.getElementById('loginForm');
    var errorBox = document.getElementById('error');
    var submitBtn = form.querySelector('button[type="submit"]');

    // Resolved once on load; submit() waits for it.
    //
    // The content-type guard matters: GitHub Pages answers unknown paths with
    // the catch-all rewrite (200 + HTML), which would parse as garbage and
    // look like "server mode". Only a JSON body counts as configured.
    var modePromise = fetch(AUTH_ENDPOINT, { credentials: 'same-origin' })
      .then(function (r) {
        var ct = r.headers.get('content-type') || '';
        if (r.status !== 200 || ct.indexOf('application/json') === -1) return null;
        return r.json().catch(function () { return null; });
      })
      .then(function (d) { return d && d.configured ? 'server' : 'local'; })
      .catch(function () { return 'local'; });

    function showError(msg) {
      errorBox.textContent = msg || '用户名或密码错误';
      errorBox.style.display = 'block';
    }

    function hex(buf) {
      var out = '';
      for (var i = 0; i < buf.length; i++) {
        out += ('0' + buf[i].toString(16)).slice(-2);
      }
      return out;
    }

    function sha256Hex(text) {
      var data = new TextEncoder().encode(AQC_ADMIN_SALT + ':' + text);
      return crypto.subtle.digest('SHA-256', data).then(function (buf) {
        return hex(new Uint8Array(buf));
      });
    }

    // Constant-time-ish string compare so the digest comparison does not
    // leak the matching prefix length through timing.
    function safeEqual(a, b) {
      if (a.length !== b.length) return false;
      var diff = 0;
      for (var i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
      return diff === 0;
    }

    function succeed(user) {
      sessionStorage.setItem('admin_logged_in', 'true');
      sessionStorage.setItem('admin_user', user);
      window.location.href = 'dashboard.html';
    }

    function fail(msg) {
      submitBtn.disabled = false;
      submitBtn.textContent = '登录';
      var pw = document.getElementById('password');
      pw.value = '';
      pw.focus();
      showError(msg);
    }

    function loginOnServer(username, password) {
      return fetch(AUTH_ENDPOINT, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', username: username, password: password }),
      })
        .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
        .then(function (d) {
          if (!d.ok) {
            var msg = d.error === 'too_many_attempts'
              ? '尝试次数过多，请稍后再试'
              : (d.error === 'bad_credentials' ? undefined : '服务端校验失败，请重试');
            fail(msg);
            return;
          }
          sessionStorage.setItem('admin_session_token', d.token);
          succeed(d.user || username);
        });
    }

    function loginLocally(username, password) {
      // crypto.subtle only exists in a secure context (https / localhost).
      if (!window.crypto || !crypto.subtle) {
        fail('当前环境不支持 Web Crypto，请通过 HTTPS 或 localhost 访问登录页');
        return Promise.resolve();
      }
      return sha256Hex(password).then(function (hash) {
        if (username === AQC_USERNAME && safeEqual(hash, AQC_PASSWORD_HASH)) {
          succeed(username);
          return;
        }
        fail();
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorBox.style.display = 'none';

      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = '验证中…';

      modePromise
        .then(function (mode) {
          return mode === 'server'
            ? loginOnServer(username, password)
            : loginLocally(username, password);
        })
        .catch(function () { fail('校验失败，请重试'); });
    });
  })();
  </script>
</body>
</html>
