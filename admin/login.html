<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaClean 后台登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--a-primary, #2563EB) 0%, var(--a-primary-dark, #1D4ED8) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-box {
      background: var(--a-surface, #FFFFFF);
      padding: 36px 40px;
      border-radius: var(--a-radius, 14px);
      box-shadow: 0 20px 60px rgb(15 23 42 / .28);
      width: 100%;
      max-width: 440px;
    }
    h1 {
      text-align: center;
      color: var(--a-brand-ink, #0B1B33);
      margin-bottom: 8px;
      font-size: 24px;
      line-height: 1.4;
    }
    .subtitle {
      text-align: center;
      color: var(--a-muted, #64748B);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--a-surface-alt, #F8FAFC);
      border: 1px solid var(--a-border, #E2E8F0);
      border-radius: var(--a-radius-sm, 8px);
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1 1 0;
      border: none;
      background: transparent;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 13.5px;
      font-family: inherit;
      font-weight: 600;
      color: var(--a-muted, #64748B);
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .tab:hover { color: var(--a-primary, #2563EB); }
    .tab.active {
      background: var(--a-surface, #FFFFFF);
      color: var(--a-primary, #2563EB);
      box-shadow: 0 1px 2px rgb(15 23 42 / .08);
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      margin-bottom: 7px;
      color: var(--a-muted, #64748B);
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--a-border, #E2E8F0);
      border-radius: var(--a-radius-sm, 8px);
      font-size: 16px;
      font-family: inherit;
      color: var(--a-text, #1E293B);
      transition: border-color .18s ease;
    }
    input:focus { outline: none; border-color: var(--a-primary, #2563EB); }
    .code-row { display: flex; gap: 10px; }
    .code-row input { flex: 1 1 0; }
    .btn-ghost {
      flex: 0 0 auto;
      padding: 0 16px;
      background: var(--a-primary-light, #DBEAFE);
      color: var(--a-primary, #2563EB);
      border: none;
      border-radius: var(--a-radius-sm, 8px);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: filter .18s ease;
    }
    .btn-ghost:hover { filter: brightness(.95); }
    .btn-ghost:disabled { opacity: .6; cursor: progress; }
    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--a-primary, #2563EB) 0%, var(--a-primary-dark, #1D4ED8) 100%);
      color: #fff;
      border: none;
      border-radius: var(--a-radius-sm, 8px);
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: filter .18s ease, box-shadow .18s ease;
    }
    button[type="submit"]:hover { filter: brightness(.94); }
    button[type="submit"]:disabled { opacity: .65; cursor: progress; }
    .error, .notice {
      margin-top: 14px;
      font-size: 14px;
      display: none;
      padding: 10px 12px;
      border-radius: var(--a-radius-sm, 8px);
      line-height: 1.5;
    }
    .error {
      color: var(--a-danger, #DC2626);
      background: #FEF2F2;
      border: 1px solid #FECACA;
    }
    .notice {
      color: #92400E;
      background: var(--a-warn-bg, #FFFBEB);
      border: 1px solid var(--a-warn-border, #FDE68A);
    }
    .hint {
      text-align: center;
      margin-top: 22px;
      color: var(--a-muted, #64748B);
      font-size: 12px;
      line-height: 1.6;
    }
    .panel { display: none; }
    .panel.active { display: block; }

    @media (max-width: 768px) {
      body { padding: 16px 12px; align-items: flex-start; }
      .login-box { padding: 26px 18px; }
      h1 { font-size: 21px; }
      .tabs { flex-wrap: wrap; }
      .tab { flex: 1 1 45%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
  <link rel="stylesheet" href="admin-theme.css">
</head>
<body>
  <div class="login-box">
    <h1>🔐 AquaClean 管理后台</h1>
    <p class="subtitle">使用管理员邮箱登录</p>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-panel="signin" role="tab">密码登录</button>
      <button type="button" class="tab" data-panel="otp" role="tab">验证码登录</button>
      <button type="button" class="tab" data-panel="reset" role="tab">忘记密码</button>
    </div>

    <!-- 密码登录 -->
    <form class="panel active" id="panel-signin" novalidate>
      <div class="form-group">
        <label for="signin-email">邮箱</label>
        <input type="email" id="signin-email" name="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="signin-password">密码</label>
        <input type="password" id="signin-password" name="password" autocomplete="current-password" placeholder="请输入密码" required>
      </div>
      <button type="submit">登录</button>
      <div class="error" data-role="error"></div>
    </form>

    <!-- 验证码登录（已注册邮箱） -->
    <form class="panel" id="panel-otp" novalidate>
      <div class="form-group">
        <label for="otp-email">邮箱</label>
        <input type="email" id="otp-email" name="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="otp-code">验证码</label>
        <div class="code-row">
          <input type="text" id="otp-code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" required>
          <button type="button" class="btn-ghost" data-role="send-otp">获取验证码</button>
        </div>
      </div>
      <button type="submit">登录</button>
      <div class="error" data-role="error"></div>
      <div class="notice" data-role="notice"></div>
    </form>

    <!--
      自助注册入口已移除。后台 URL 是公开的，任何拿到链接的人都能给自己
      开一个管理员账号，进而改写全站内容并往仓库提交。账号现在只能在
      WorkBuddy 云服务端手工创建。
    -->

    <!-- 忘记密码 -->
    <form class="panel" id="panel-reset" novalidate>
      <div class="form-group">
        <label for="reset-email">邮箱</label>
        <input type="email" id="reset-email" name="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="reset-code">验证码</label>
        <input type="text" id="reset-code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="收到邮件后填写" required>
      </div>
      <div class="form-group">
        <label for="reset-password">新密码</label>
        <input type="password" id="reset-password" name="password" autocomplete="new-password" placeholder="至少 8 位" required>
      </div>
      <button type="submit">重置密码</button>
      <div class="error" data-role="error"></div>
      <div class="notice" data-role="notice"></div>
    </form>

    <div class="hint">AquaClean Home · 内容管理后台<br>登录即表示你已获授权管理本站内容</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="cloud.js"></script>
  <script>
  (function () {
    'use strict';

    // Per-panel OTP state, deliberately kept outside the event handlers:
    // submitting a code must never send a new one.
    var pending = { otp: null, reset: null };

    function $(id) { return document.getElementById(id); }

    function showError(panel, msg) {
      var box = panel.querySelector('[data-role="error"]');
      box.textContent = msg;
      box.style.display = msg ? 'block' : 'none';
      var notice = panel.querySelector('[data-role="notice"]');
      if (notice) notice.style.display = 'none';
    }

    function showNotice(panel, msg) {
      var box = panel.querySelector('[data-role="notice"]');
      if (!box) return;
      box.textContent = msg;
      box.style.display = msg ? 'block' : 'none';
    }

    function busy(panel, on, label) {
      var btn = panel.querySelector('button[type="submit"]');
      btn.disabled = on;
      if (on) {
        btn.dataset.label = btn.textContent;
        btn.textContent = label || '处理中…';
      } else if (btn.dataset.label) {
        btn.textContent = btn.dataset.label;
      }
    }

    // Navigate only after the service confirms a live session. The SDK's
    // return shape varies between builds, so the sign-in response alone is not
    // something to navigate on.
    function enterIfSession(cloud, panel) {
      return cloud.auth.getSession().then(function (s) {
        if (window.aqcHasSession(s)) {
          window.location.href = 'index.html';
          return true;
        }
        busy(panel, false);
        showError(panel, '登录未能建立会话，请重试');
        return false;
      });
    }

    function fail(panel, err) {
      var kind = err && err.kind;
      var msg = (err && err.message) || '操作失败，请重试';
      if (kind === 'network' || kind === 'backend-unavailable') {
        msg = '网络或服务暂时不可用，请稍后重试';
      }
      showError(panel, msg);
      busy(panel, false);
    }

    // Never fail silently again: an uncaught error used to leave the form
    // looking inert, with no clue why nothing happened.
    window.addEventListener('unhandledrejection', function (e) {
      var panel = document.querySelector('.panel.active') || $('panel-signin');
      if (panel) showError(panel, '操作异常：' + ((e.reason && e.reason.message) || '请刷新后重试'));
    });
    window.addEventListener('error', function (e) {
      var panel = document.querySelector('.panel.active') || $('panel-signin');
      if (panel) showError(panel, '页面异常：' + (e.message || '请刷新后重试'));
    });

    // ── tabs ────────────────────────────────────────────────────
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.addEventListener('click', function () {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) {
          x.classList.toggle('active', x === t);
        });
        Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) {
          p.classList.toggle('active', p.id === 'panel-' + t.dataset.panel);
        });
      });
    });

    // ── shared: send an email code ──────────────────────────────
    function wireSend(panelId, key) {
      var panel = $(panelId);
      var btn = panel.querySelector('[data-role="send-otp"]');
      var emailInput = panel.querySelector('input[type="email"]');
      var seconds = 0;

      btn.addEventListener('click', function () {
        var email = emailInput.value.trim();
        if (!email) { showError(panel, '请先填写邮箱'); return; }
        if (seconds > 0) return;

        btn.disabled = true;
        showError(panel, '');
        window.aqcCloudReady.then(function (cloud) {
          return cloud.auth.sendOtp({ email: email });
        }).then(function (res) {
          if (res && res.error) { btn.disabled = false; fail(panel, res.error); return; }
          pending[key] = {
            email: email,
            verificationId: res.data.verificationId,
            isExistingUser: res.data.isExistingUser
          };
          showNotice(panel, '验证码已发送到 ' + email);
          // countdown guards the send action only
          seconds = 60;
          var tick = setInterval(function () {
            btn.textContent = seconds + ' 秒后重发';
            if (--seconds <= 0) {
              clearInterval(tick);
              btn.disabled = false;
              btn.textContent = '获取验证码';
            }
          }, 1000);
          btn.textContent = seconds + ' 秒后重发';
        }).catch(function (e) { btn.disabled = false; fail(panel, e); });
      });
    }

    wireSend('panel-otp', 'otp');

    function codeOf(panel) {
      return (panel.querySelector('input[name="code"]').value || '').trim();
    }
    function passwordOf(panel) {
      return panel.querySelector('input[name="password"]').value || '';
    }

    // ── password sign-in ────────────────────────────────────────
    $('panel-signin').addEventListener('submit', function (e) {
      e.preventDefault();
      var panel = this;
      var email = $('signin-email').value.trim();
      var password = $('signin-password').value;
      if (!email || !password) { showError(panel, '请填写邮箱和密码'); return; }
      showError(panel, '');
      busy(panel, true, '登录中…');
      window.aqcCloudReady.then(function (cloud) {
        return cloud.auth.signInWithPassword({ email: email, password: password })
          .then(function (res) {
            if (res && res.error) {
              var msg = (res.error.kind === 'invalid_grant')
                ? '邮箱或密码不正确'
                : ((res.error && res.error.message) || '登录失败，请重试');
              showError(panel, msg);
              busy(panel, false);
              return;
            }
            // Ask the service whether a session really exists before moving
            // on. Trusting the return value alone is how you end up bounced
            // back by the guard with no explanation.
            return enterIfSession(cloud, panel);
          });
      }).catch(function (err) { fail(panel, err); });
    });

    // ── OTP sign-in (existing account) ──────────────────────────
    $('panel-otp').addEventListener('submit', function (e) {
      e.preventDefault();
      var panel = this;
      var email = $('otp-email').value.trim();
      var code = codeOf(panel);
      if (!pending.otp) { showError(panel, '请先获取验证码'); return; }
      if (pending.otp.email !== email) { showError(panel, '请为当前邮箱重新获取验证码'); return; }
      if (!code) { showError(panel, '请填写验证码'); return; }
      showError(panel, '');
      busy(panel, true, '登录中…');
      window.aqcCloudReady.then(function (cloud) {
        return cloud.auth.verifyOtp({
          email: pending.otp.email,
          verificationId: pending.otp.verificationId,
          isExistingUser: pending.otp.isExistingUser,
          token: code
        }).then(function (res) {
          if (res && res.error) {
            showError(panel, '验证码无效或已过期');
            busy(panel, false);
            return;
          }
          pending.otp = null;
          return enterIfSession(cloud, panel);
        });
      }).catch(function (err) { fail(panel, err); });
    });

    // 自助注册已移除（见上方注释）。

    // ── forgot password ─────────────────────────────────────────
    $('panel-reset').addEventListener('submit', function (e) {
      e.preventDefault();
      var panel = this;
      var email = $('reset-email').value.trim();
      var code = codeOf(panel);
      var password = passwordOf(panel);
      if (!email) { showError(panel, '请填写邮箱'); return; }
      if (!code) { showError(panel, '请填写邮件中的验证码'); return; }
      if (password.length < 8) { showError(panel, '新密码至少 8 位'); return; }
      showError(panel, '');
      busy(panel, true, '重置中…');
      window.aqcCloudReady.then(function (cloud) {
        return cloud.auth.resetPasswordForEmail(email);
      }).then(function (started) {
        if (started && started.error) { fail(panel, started.error); return null; }
        return started.data.updateUser({ nonce: code, password: password });
      }).then(function (done) {
        if (!done) return;
        if (done.error) { showError(panel, '重置失败：验证码无效或已过期'); busy(panel, false); return; }
        showError(panel, '');
        showNotice(panel, '密码已重置，请用新密码登录');
        busy(panel, false);
        document.querySelector('.tab[data-panel="signin"]').click();
      }).catch(function (err) { fail(panel, err); });
    });

    // Already signed in? Skip the form.
    window.aqcCloudReady.then(function (cloud) {
      return cloud.auth.getSession();
    }).then(function (res) {
      if (window.aqcHasSession(res)) window.location.replace('index.html');
    }).catch(function () { /* stay on the login form */ });
  })();
  </script>
</body>
</html>
