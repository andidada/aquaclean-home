<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaClean 后台登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--a-primary, #2563EB) 0%, var(--a-primary-dark, #1D4ED8) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-box {
      background: var(--a-surface, #FFFFFF);
      padding: 40px;
      border-radius: var(--a-radius, 14px);
      box-shadow: 0 20px 60px rgb(15 23 42 / .28);
      width: 100%;
      max-width: 420px;
    }
    h1 {
      text-align: center;
      color: var(--a-brand-ink, #0B1B33);
      margin-bottom: 8px;
      font-size: 24px;
      line-height: 1.4;
    }
    .subtitle {
      text-align: center;
      color: var(--a-muted, #64748B);
      font-size: 14px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--a-muted, #64748B);
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--a-border, #E2E8F0);
      border-radius: var(--a-radius-sm, 8px);
      font-size: 16px;
      font-family: inherit;
      color: var(--a-text, #1E293B);
      transition: border-color .18s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--a-primary, #2563EB);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--a-primary, #2563EB) 0%, var(--a-primary-dark, #1D4ED8) 100%);
      color: #fff;
      border: none;
      border-radius: var(--a-radius-sm, 8px);
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: filter .18s ease, box-shadow .18s ease;
    }
    button:hover {
      filter: brightness(.94);
      box-shadow: 0 8px 20px -6px rgb(37 99 235 / .45);
    }
    .error {
      color: var(--a-danger, #DC2626);
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }
    .hint {
      text-align: center;
      margin-top: 20px;
      color: var(--a-muted, #64748B);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      body { padding: 16px 12px; align-items: flex-start; }
      .login-box { padding: 28px 20px; max-width: 100%; }
      h1 { font-size: 21px; }
      input { font-size: 16px; } /* 16px stops iOS Safari zooming on focus */
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
  <link rel="stylesheet" href="admin-theme.css">
</head>
<body>
  <div class="login-box">
    <h1>🔐 AquaClean 管理后台</h1>
    <p class="subtitle">登录后可管理产品内容与分类</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button type="submit">登录</button>
      <div class="error" id="error">用户名或密码错误</div>
    </form>
    <div class="hint">AquaClean Home · 内容管理后台</div>
  </div>

  <script>
    // 简单的登录验证
    const VALID_USERNAME = 'admin';
    const VALID_PASSWORD = 'aquaclean2024';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (username === VALID_USERNAME && password === VALID_PASSWORD) {
        // 登录成功，存储会话
        sessionStorage.setItem('admin_logged_in', 'true');
        sessionStorage.setItem('admin_user', username);
        // 跳转到管理面板
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
