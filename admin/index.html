<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 · AquaClean</title>
<link rel="icon" href="../favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=20260823a">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="admin-bar">
  <div class="admin-bar-inner">
    <span class="admin-logo">🏠 AquaClean <b>后台</b></span>
    <span class="admin-hint">本地草稿自动保存 · 无需登录 · 导出 JSON 后推送 GitHub</span>
  </div>
</header>
<main class="admin-main">
  <aside class="admin-side" id="sidebar">
    <!-- rebuilt by buildSidebar() in admin.js -->
  </aside>
  <section class="admin-form" id="formArea">
    <div class="admin-empty" style="padding:80px 20px;text-align:center;">
      <div style="font-size:48px;margin-bottom:16px;">🏠</div>
      <div style="font-size:18px;font-weight:700;color:#0F172A;margin-bottom:8px;">AquaClean 内容管理器</div>
      <div style="color:#64748B;font-size:14px;line-height:1.6;">
        选择左侧「📦 产品」或「🏠 首页」标签页<br>从线上拉取现有内容，在线编辑后导出 JSON
      </div>
    </div>
  </section>
</main>
<input type="file" id="importFile" accept="application/json" hidden>
<script src="admin.js?v=3"></script>
</body>
</html>
