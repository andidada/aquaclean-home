<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaClean Home — Smart Cleaning Appliances</title>
  <meta name="description" content="Professional B2B manufacturer of smart home cleaning appliances. OEM/ODM available. Robot vacuums, steam cleaners, UV mite removers, window robots, car vacuums, tire inflators.">
  <link rel="canonical" href="./en/">
  <script>
    // Check if this is an Identity or GitHub OAuth callback
    const hash = window.location.hash;
    const params = new URLSearchParams(window.location.search);
    
    if (
      // Netlify Identity callbacks
      hash.includes('recovery_token') ||
      hash.includes('confirmation_token') ||
      hash.includes('invite_token') ||
      hash.includes('access_token') ||
      // GitHub OAuth callback
      params.has('code') ||
      params.has('token_type')
    ) {
      window.location.replace('./admin/' + window.location.search + window.location.hash);
    } else {
      window.location.replace('./en/');
    }
  </script>
</head>
<body>
  <p style="font-family:'Inter',sans-serif;text-align:center;padding-top:40vh;color:#64748B;margin:0;">Loading AquaClean Home…</p>
</body>
</html>
